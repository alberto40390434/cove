<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cove</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="auth" id="auth" hidden>
  <form class="authbox" id="authForm">
    <h1>Cove</h1>
    <p id="authSub">Log in to continue</p>
    <input id="email" type="email" placeholder="Email" required autocomplete="email">
    <input id="username" placeholder="Username (3-20 characters)" autocomplete="username" hidden>
    <input id="password" type="password" placeholder="Password (6+ characters)" required minlength="6" autocomplete="current-password">
    <button class="primary" id="authBtn" type="submit">Log in</button>
    <div class="msg" id="authMsg" role="alert"></div>
    <button class="link" id="authSwitch" type="button">Need an account? Sign up</button>
  </form>
</div>

<div class="app" id="app" hidden>
  <nav class="rail" aria-label="Servers">
    <button class="srv home on" data-act="home" aria-label="Home"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg><span class="badge" id="homeBadge" hidden></span></button>
    <div class="sep"></div>
    <div id="servers"></div>
    <button class="srv add" data-act="newserver" aria-label="Create or join a server">+</button>
  </nav>

  <aside class="side">
    <div class="sidepane" id="homeSide">
    <button class="find" data-tab="add">Find or start a conversation</button>
    <div class="nav"><button class="navbtn on" data-act="home"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3.2-5.5 6.5-5.5s5.9 1.9 6.5 5.5"/><path d="M16 4.7a3.5 3.5 0 0 1 0 6.6M18 14.8c1.8.7 3 2.4 3.5 5.2"/></svg>Friends</button></div>
    <div class="dmhead">Direct messages <button class="ib" data-act="newgroup" aria-label="Create a group chat" title="Create a group chat" style="width:24px;height:24px">+</button></div>
    <div class="dmlist" id="dms"></div>
    </div>
    <div class="sidepane" id="srvSide" hidden>
      <div class="srvhead"><button class="srvname" data-act="srvmenu" aria-haspopup="true" title="Server menu"><span id="srvName"></span><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
        <span><button class="ib" data-act="invite" aria-label="Show invite code" title="Invite people"><svg viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg></button>
        <button class="ib" id="setBtn" data-act="settings" aria-label="Server settings" title="Roles and members" hidden><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.6 5.6l1.8 1.8M16.6 16.6l1.8 1.8M5.6 18.4l1.8-1.8M16.6 7.4l1.8-1.8"/></svg></button>
        <button class="ib" id="leaveBtn" data-act="leave" aria-label="Leave server" title="Leave server"><svg viewBox="0 0 24 24"><path d="M9 4H5a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h4M16 8l4 4-4 4M20 12H9"/></svg></button></span></div>
      <div class="dmhead">Channels <button class="ib" id="addCh" data-act="newchannel" aria-label="Add channel" title="Add channel" style="width:24px;height:24px">+</button></div>
      <div class="dmlist" id="chList"></div>
    </div>
    <div class="notifbar" id="notifBar" hidden><span>Get notified about new messages, even when Cove is in the background.</span><button class="primary sm" data-act="enablenotifs">Turn on</button><button class="ib" data-act="dismissnotifs" aria-label="Not now" title="Not now"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div class="callbar" id="callBar" hidden>
      <div class="callinfo" data-act="callview" role="button" tabindex="0" title="Open call"><b id="callLabel"></b><small id="callState">Connecting...</small></div>
      <button class="ib" data-act="leavecall" aria-label="Leave call" title="Leave call"><svg viewBox="0 0 24 24"><path d="M4 15c4-4 12-4 16 0l-2 3-3-1.5v-2.5a9 9 0 0 0-6 0v2.5L6 18z"/></svg></button>
    </div>
    <div class="me">
      <button class="mebtn" id="meBtn" data-act="statusmenu" aria-haspopup="true" aria-expanded="false" aria-label="Change your status">
        <span class="av online" id="meAv"></span>
        <span class="who"><b id="meName"></b><span id="meStatus">Online</span></span>
      </button>
      <div class="statusmenu" id="statusMenu" role="menu" hidden>
        <button role="menuitem" data-act="editprofile">Edit profile</button>
        <div class="msep"></div>
        <button role="menuitem" data-act="setstatus" data-s="online"><span class="dot online"></span>Online</button>
        <button role="menuitem" data-act="setstatus" data-s="away"><span class="dot idle"></span>Away</button>
        <button role="menuitem" data-act="setstatus" data-s="dnd"><span class="dot dnd"></span>Do not disturb</button>
        <button role="menuitem" data-act="setstatus" data-s="offline"><span class="dot"></span>Offline</button>
      </div>
      <button class="ib" id="mic" aria-pressed="false" aria-label="Mute microphone"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
      <button class="ib" id="deaf" aria-pressed="false" aria-label="Deafen"><svg viewBox="0 0 24 24"><path d="M4 15v-3a8 8 0 0 1 16 0v3"/><rect x="3" y="14" width="4" height="6" rx="1.5"/><rect x="17" y="14" width="4" height="6" rx="1.5"/></svg></button>
      <button class="ib" id="logout" aria-label="Log out" title="Log out"><svg viewBox="0 0 24 24"><path d="M9 4H5a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h4M16 8l4 4-4 4M20 12H9"/></svg></button>
    </div>
  </aside>

  <main class="main">
    <div class="topwrap">
      <button class="ib menu" data-act="menu" aria-label="Open menu"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <header class="top" id="top" role="tablist"></header>
      <button class="ib memb" data-act="members" aria-label="Show people"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3.2-5.5 6.5-5.5s5.9 1.9 6.5 5.5"/><path d="M16 4.7a3.5 3.5 0 0 1 0 6.6M18 14.8c1.8.7 3 2.4 3.5 5.2"/></svg></button>
    </div>
    <div class="body" id="view"></div>
    <div class="stagepane" id="stagePane" hidden>
      <div class="stagehead"><button class="ib" data-act="callhide" aria-label="Back to chat" title="Back to chat"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button><b id="stageTitle"></b></div>
      <div class="stage" id="stage"></div>
      <div class="ctrls">
        <button class="cbtn" id="cMic" data-act="tmic" aria-label="Mute" title="Mute"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
        <button class="cbtn" id="cCam" data-act="tcam" aria-label="Camera" title="Camera"><svg viewBox="0 0 24 24"><path d="M3 7h11a1 1 0 0 1 1 1v8a1 1 0 0 1-1 1H3zM15 11l6-3v8l-6-3"/></svg></button>
        <button class="cbtn" id="cScreen" data-act="tscreen" aria-label="Share screen" title="Share your screen"><svg viewBox="0 0 24 24"><path d="M3 5h18v11H3zM8 20h8M12 16v4"/></svg></button>
        <button class="cbtn" id="cDeaf" data-act="tdeaf" aria-label="Deafen" title="Deafen"><svg viewBox="0 0 24 24"><path d="M4 15v-3a8 8 0 0 1 16 0v3"/><rect x="3" y="14" width="4" height="6" rx="1.5"/><rect x="17" y="14" width="4" height="6" rx="1.5"/></svg></button>
        <button class="cbtn end" data-act="leavecall" aria-label="Leave call" title="Leave call"><svg viewBox="0 0 24 24"><path d="M4 15c4-4 12-4 16 0l-2 3-3-1.5v-2.5a9 9 0 0 0-6 0v2.5L6 18z"/></svg></button>
      </div>
    </div>
  </main>

  <div class="scrim" data-act="closepanels"></div>
  <aside class="active">
    <h2 id="rightTitle">Active now</h2>
    <div id="activeList"></div>
  </aside>
</div>

<div class="audiobox" id="audioBox"></div>

<div class="ctxmenu" id="msgMenu" role="menu" hidden></div>
<div class="picker" id="picker" role="dialog" aria-label="Pick an emoji" hidden></div>

<div class="ctxmenu" id="ctxMenu" role="menu" hidden>
  <button role="menuitem" data-act="ctxcat">Create category</button>
  <button role="menuitem" data-act="newchannel">Create channel</button>
</div>

<div class="auth" id="grpModal" hidden>
  <div class="authbox"><div id="grpBody"></div></div>
</div>

<div class="auth" id="edModal" hidden>
  <div class="authbox"><div id="edBody"></div></div>
</div>

<div class="auth" id="chModal" hidden>
  <div class="authbox">
    <h1>Add to server</h1>
    <form id="chForm">
      <input id="chName" placeholder="Channel name" maxlength="30" required autocomplete="off">
      <select id="chType" aria-label="Channel type"><option value="text">Text channel</option><option value="voice">Voice channel</option></select>
      <select id="chCat" aria-label="Category"></select>
      <button class="primary" type="submit">Create channel</button>
    </form>
    <p>Or make a category to group channels</p>
    <form id="catForm"><input id="catName" placeholder="Category name" maxlength="30" required autocomplete="off"><button class="primary" type="submit">Create category</button></form>
    <div class="msg" id="chMsg" role="alert"></div>
    <button class="link" type="button" data-act="closech">Cancel</button>
  </div>
</div>

<div class="auth" id="setModal" hidden>
  <div class="authbox wide settings">
    <div class="sethead"><h1>Server settings</h1><button class="ib" data-act="closeset" aria-label="Close settings"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div class="settabs"><button class="tab on" data-act="settab" data-id="roles">Roles</button><button class="tab" data-act="settab" data-id="members">Members</button><button class="tab" data-act="settab" data-id="invite">Invite</button><button class="tab" data-act="settab" data-id="moderation">Moderation</button></div>
    <div id="setBody"></div>
    <div class="msg" id="setMsg" role="status"></div>
  </div>
</div>

<div class="auth" id="profModal" hidden>
  <div class="authbox prof"><div id="profBody"></div></div>
</div>

<div class="auth" id="verify" hidden>
  <div class="authbox">
    <h1>Check your email</h1>
    <p id="verifyText"></p>
    <button class="primary" id="verifiedBtn" type="button">I've verified my email</button>
    <button class="link" id="resendBtn" type="button">Resend email</button>
    <div class="msg" id="verifyMsg" role="status"></div>
    <button class="link" id="verifyOut" type="button">Log out</button>
  </div>
</div>

<div class="auth" id="modal" hidden>
  <div class="authbox">
    <h1>Add a server</h1>
    <form id="createForm"><input id="srvNameIn" placeholder="Name your server" maxlength="40" required><button class="primary" type="submit">Create server</button></form>
    <p>Or join one with an invite code</p>
    <form id="joinForm"><input id="codeIn" placeholder="Invite code" required autocomplete="off"><button class="primary" type="submit">Join server</button></form>
    <div class="msg" id="modalMsg" role="alert"></div>
    <button class="link" type="button" data-act="closemodal">Cancel</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/livekit-client@2.21.0/dist/livekit-client.umd.min.js"></script>
<script type="module" src="script.js"></script>
</body>
</html>
